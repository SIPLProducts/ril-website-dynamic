# /apps/website/ril-website/nginx/ril.conf  (linked into /etc/nginx/sites-enabled/ril.conf)
# Port 80  = internal HTTP  (http://10.200.1.8)
# Port 443 = HTTPS          (https://10.200.1.8, https://38.31.132.10, domain later)
# The website calls the backend on the same address it was opened with,
# so BOTH blocks must forward /auth/v1, /rest/v1, /storage/v1, /realtime/v1.

geo $ril_internal {
    default        0;
    127.0.0.1      1;
    10.0.0.0/8     1;
    172.16.0.0/12  1;
    192.168.0.0/16 1;
}

map $http_upgrade $ril_connection { default upgrade; '' close; }

server {
    listen 80 default_server;
    server_name 10.200.1.8 _;
    client_max_body_size 50M;

    location ~ ^/(rest|auth|storage|realtime|functions)/v1/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ril_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /__l5e/ {
        proxy_pass https://id-preview--a0d81829-f7da-46aa-90b9-e21b318b353f.lovable.app;
        proxy_ssl_server_name on;
        proxy_set_header Host id-preview--a0d81829-f7da-46aa-90b9-e21b318b353f.lovable.app;
    }

    location ^~ /admin {
        if ($ril_internal = 0) { return 403; }
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl http2 default_server;
    server_name 38.31.132.10 10.200.1.8 _;

    ssl_certificate     /apps/website/ril-website/ssl/star_ramky_com_fullchain.crt;
    ssl_certificate_key /apps/website/ril-website/ssl/star_ramky_com_Pvt.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 50M;

    location ~ ^/(rest|auth|storage|realtime|functions)/v1/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ril_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }

    location /__l5e/ {
        proxy_pass https://id-preview--a0d81829-f7da-46aa-90b9-e21b318b353f.lovable.app;
        proxy_ssl_server_name on;
        proxy_set_header Host id-preview--a0d81829-f7da-46aa-90b9-e21b318b353f.lovable.app;
    }

    location ^~ /admin {
        if ($ril_internal = 0) { return 403; }
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
