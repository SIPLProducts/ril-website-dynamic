# /etc/nginx/sites-available/ril-website
# Port 443 ONLY. No domain. Public IP 38.31.132.10 -> private 10.200.1.8.
# IPv6 is disabled on this server: no [::] listen lines.

# Who counts as "inside the organization" (edit if your office uses other ranges)
geo $ril_internal {
    default        0;
    127.0.0.1      1;
    10.0.0.0/8     1;
    172.16.0.0/12  1;
    192.168.0.0/16 1;
}

server {
    listen 443 ssl http2 default_server;
    server_name 38.31.132.10 10.200.1.8 _;

    ssl_certificate     /etc/nginx/ssl/ril-ip.crt;
    ssl_certificate_key /etc/nginx/ssl/ril-ip.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 50M;

    # Backend API (database, login, files) -> Docker on 8000. Studio is NOT exposed.
    location ~ ^/(rest|auth|storage|realtime)/v1/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }

    # Admin portal -> only from inside the organization. Internet gets 403.
    location ^~ /admin {
        if ($ril_internal = 0) { return 403; }
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Public website -> Node on 3000
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
