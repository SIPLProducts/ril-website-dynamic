# /etc/nginx/sites-available/ril-website
# Public IP 38.31.132.10 -> 10.200.1.8. IPv6 is disabled on this server: no [::] listen lines.
server {
    listen 80;
    server_name ril.siplproducts.com 38.31.132.10;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://ril.siplproducts.com$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name ril.siplproducts.com 38.31.132.10;
    ssl_certificate     /etc/letsencrypt/live/ril.siplproducts.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ril.siplproducts.com/privkey.pem;
    client_max_body_size 50M;

    # Supabase API (database, login, files) -> Docker on 8000. Studio dashboard NOT exposed.
    location ~ ^/(rest|auth|storage|realtime)/v1/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
    # Website + /admin -> Node on 3000
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
